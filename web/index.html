<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeAI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%232558f0'/><path d='M10 23V9h12M10 16h9' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail">
    <a class="brand" href="#/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2558f0"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><rect width="32" height="32" rx="9"/><path d="M10 23V9h12M10 16h9"/></svg>
      <span>ForgeAI</span>
    </a>
    <a class="new-btn" href="#/new">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      Build an agent
    </a>
    <div class="rail-label">Agents</div>
    <nav id="run-list" class="run-list"></nav>
    <div class="rail-foot" id="health"></div>
  </aside>
  <main id="main" class="main"></main>
</div>
<div id="drawer" class="drawer" hidden>
  <div class="drawer-backdrop" data-close></div>
  <section class="drawer-panel" role="dialog" aria-modal="true">
    <button class="icon-btn drawer-close" data-close aria-label="Close">
      <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
    <div id="drawer-body"></div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
